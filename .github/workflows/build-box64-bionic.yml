name: Build Box64 for Android (Bionic) — Auto Update

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────────────────────────
  # شيك على تحديثات
  # ─────────────────────────────────────────────────────────────────
  check-update:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.compare.outputs.should_build }}
      upstream_tag:  ${{ steps.compare.outputs.upstream_tag }}

    steps:
      - name: Get upstream latest tag
        id: upstream
        run: |
          TAG=$(curl -sf https://api.github.com/repos/ptitSeb/box64/releases/latest \
                | jq -r '.tag_name')
          echo "upstream_tag=$TAG" >> $GITHUB_OUTPUT

      - name: Get last tag we built
        id: local
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LAST=$(gh release list --repo ${{ github.repository }} \
                   --limit 1 --json tagName -q '.[0].tagName' 2>/dev/null || echo "none")
          echo "last_tag=$LAST" >> $GITHUB_OUTPUT

      - name: Compare
        id: compare
        run: |
          UPSTREAM="${{ steps.upstream.outputs.upstream_tag }}"
          LAST="${{ steps.local.outputs.last_tag }}"
          echo "Upstream : $UPSTREAM"
          echo "Last built: $LAST"
          if [[ "$LAST" == "${UPSTREAM}-android" ]]; then
            echo "✅ Already up-to-date"
            echo "should_build=false" >> $GITHUB_OUTPUT
          else
            echo "🆕 New version — building"
            echo "should_build=true" >> $GITHUB_OUTPUT
          fi
          echo "upstream_tag=$UPSTREAM" >> $GITHUB_OUTPUT

  # ─────────────────────────────────────────────────────────────────
  # البيلد — NDK r29 فقط، بدون BOLT
  # ─────────────────────────────────────────────────────────────────
  build:
    needs: check-update
    if: needs.check-update.outputs.should_build == 'true'
    runs-on: ubuntu-latest

    env:
      NDK_VERSION:  r29
      API_LEVEL:    35
      UPSTREAM_TAG: ${{ needs.check-update.outputs.upstream_tag }}

    steps:
      - name: Checkout Box64 source
        uses: actions/checkout@v4
        with:
          repository: ptitSeb/box64
          ref: ${{ env.UPSTREAM_TAG }}
          fetch-depth: 0

      # ── NDK r29 ────────────────────────────────────────────────────
      - name: Download NDK r29
        run: |
          wget -q \
            https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip \
            -O ndk.zip
          unzip -qq ndk.zip
          echo "NDK_ROOT=$PWD/android-ndk-${NDK_VERSION}" >> $GITHUB_ENV

      # ── Export الأدوات من NDK ──────────────────────────────────────
      - name: Export NDK toolchain vars
        run: |
          TC="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64"
          BIN="$TC/bin"
          TARGET="aarch64-linux-android${API_LEVEL}"

          echo "NDK_BIN=$BIN"                   >> $GITHUB_ENV
          echo "CC=$BIN/${TARGET}-clang"         >> $GITHUB_ENV
          echo "CXX=$BIN/${TARGET}-clang++"      >> $GITHUB_ENV
          echo "STRIP=$BIN/llvm-strip"           >> $GITHUB_ENV
          echo "SYSROOT=$TC/sysroot"             >> $GITHUB_ENV
          echo "$BIN"                            >> $GITHUB_PATH

      # ── Configure ─────────────────────────────────────────────────
      # -fPIE / -pie مطلوبين على Android Bionic
      # ThinLTO بيدي performance أحسن بكثير من الـ default
      - name: Configure (CMake)
        run: |
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-${{ env.API_LEVEL }} \
            -DANDROID_STL=none \
            -DARM64=1 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-O3 -fPIE -flto=thin" \
            -DCMAKE_CXX_FLAGS="-O3 -fPIE -flto=thin" \
            -DCMAKE_EXE_LINKER_FLAGS="-pie -fuse-ld=lld -flto=thin"

      - name: Compile
        run: cmake --build build -j$(nproc)

      # ── Strip ──────────────────────────────────────────────────────
      - name: Strip binary
        run: "$STRIP -s build/box64"

      # ── تأكد إن الـ binary صح قبل الرفع ───────────────────────────
      - name: Verify ELF
        run: |
          file build/box64
          "$NDK_BIN/llvm-readelf" -d build/box64 | grep -E "NEEDED|PLTREL|FLAGS"

      # ── ضغط بـ xz أقصى مستوى ──────────────────────────────────────
      # -9e = level 9 + extreme mode → أصغر حجم ممكن
      # --threads=0 = يستخدم كل الـ cores
      # --keep = يحتفظ بالملف الأصلي
      - name: Compress (xz -9e)
        run: |
          xz -9e --threads=0 --keep build/box64
          echo "Original : $(du -sh build/box64     | cut -f1)"
          echo "Compressed: $(du -sh build/box64.xz  | cut -f1)"

      # ── Release notes ──────────────────────────────────────────────
      - name: Fetch release notes
        id: notes
        run: |
          RELEASE=$(curl -sf \
            https://api.github.com/repos/ptitSeb/box64/releases/tags/${{ env.UPSTREAM_TAG }})
          BODY=$(echo "$RELEASE" | jq -r '.body // "No release notes."')
          {
            echo "body<<__EOF__"
            echo "$BODY"
            echo ""
            echo "---"
            echo "### Build info"
            echo "- ✅ **ThinLTO** (LLVM LLD from NDK r29)"
            echo "- ✅ **PIE** — fully compatible with Android Bionic linker"
            echo "- ✅ **Android Bionic** — NDK ${{ env.NDK_VERSION }}, API ${{ env.API_LEVEL }}"
            echo "- 📦 Compressed with **xz -9e** — decompress with: \`xz -d box64.xz\`"
            echo "- 🔖 Upstream: \`${{ env.UPSTREAM_TAG }}\`"
            echo "__EOF__"
          } >> $GITHUB_OUTPUT

      # ── Publish ────────────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ env.UPSTREAM_TAG }}-android"
          name:     "Box64 ${{ env.UPSTREAM_TAG }} — Android Bionic (API ${{ env.API_LEVEL }})"
          body:     "${{ steps.notes.outputs.body }}"
          files:    build/box64.xz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
