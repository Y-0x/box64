name: Build Box64 for Android (Bionic) — Auto Update

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ───────────────────────────────────────────────────────────────────
  # 1. شيك على تحديثات
  # ───────────────────────────────────────────────────────────────────
  check-update:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.compare.outputs.should_build }}
      upstream_tag:  ${{ steps.compare.outputs.upstream_tag }}

    steps:
      - name: Get upstream latest tag
        id: upstream
        run: |
          TAG=$(curl -sf https://api.github.com/repos/ptitSeb/box64/releases/latest \
                | jq -r '.tag_name')
          echo "upstream_tag=$TAG" >> $GITHUB_OUTPUT

      - name: Get last tag we built
        id: local
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LAST=$(gh release list --repo ${{ github.repository }} \
                   --limit 1 --json tagName -q '.[0].tagName' 2>/dev/null || echo "none")
          echo "last_tag=$LAST" >> $GITHUB_OUTPUT

      - name: Compare
        id: compare
        run: |
          UPSTREAM="${{ steps.upstream.outputs.upstream_tag }}"
          LAST="${{ steps.local.outputs.last_tag }}"
          EXPECTED="${UPSTREAM}-android"
          echo "Upstream : $UPSTREAM"
          echo "Last built: $LAST"
          if [[ "$LAST" == "$EXPECTED" ]]; then
            echo "✅ Already up-to-date"
            echo "should_build=false" >> $GITHUB_OUTPUT
          else
            echo "🆕 New version — building"
            echo "should_build=true" >> $GITHUB_OUTPUT
          fi
          echo "upstream_tag=$UPSTREAM" >> $GITHUB_OUTPUT

  # ───────────────────────────────────────────────────────────────────
  # 2. البيلد
  # ───────────────────────────────────────────────────────────────────
  build:
    needs: check-update
    if: needs.check-update.outputs.should_build == 'true'
    runs-on: ubuntu-latest

    env:
      NDK_VERSION: r27c
      API_LEVEL:   28
      UPSTREAM_TAG: ${{ needs.check-update.outputs.upstream_tag }}

    steps:
      - name: Checkout Box64 source
        uses: actions/checkout@v4
        with:
          repository: ptitSeb/box64
          ref: ${{ env.UPSTREAM_TAG }}
          fetch-depth: 0

      # ── NDK ─────────────────────────────────────────────────────────
      - name: Download NDK
        run: |
          wget -q \
            https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip \
            -O ndk.zip
          unzip -qq ndk.zip
          echo "NDK_ROOT=$PWD/android-ndk-${NDK_VERSION}" >> $GITHUB_ENV

      # ── BOLT + ninja ─────────────────────────────────────────────────
      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bolt ninja-build

      # ── Configure via NDK toolchain file ────────────────────────────
      - name: Configure (CMake)
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-${{ env.API_LEVEL }} \
            -DANDROID_STL=none \
            -DARM64=1 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-O3 -flto=thin" \
            -DCMAKE_CXX_FLAGS="-O3 -flto=thin" \
            -DCMAKE_EXE_LINKER_FLAGS="-fuse-ld=lld -flto=thin -Wl,--emit-relocs"

      - name: Compile
        run: cmake --build build -j$(nproc)

      # ── BOLT ────────────────────────────────────────────────────────
      - name: BOLT optimize
        run: |
          llvm-bolt build/box64 \
            --reorder-blocks=ext-tsp \
            --reorder-functions=hfsort \
            --split-functions \
            --split-all-cold \
            --split-eh \
            --dyno-stats \
            -o build/box64.bolt
          mv build/box64.bolt build/box64

      # ── Strip ────────────────────────────────────────────────────────
      - name: Strip binary
        run: |
          STRIP="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          $STRIP -s build/box64

      # ── Release notes ────────────────────────────────────────────────
      - name: Fetch release notes
        id: notes
        run: |
          RELEASE=$(curl -sf \
            https://api.github.com/repos/ptitSeb/box64/releases/tags/${{ env.UPSTREAM_TAG }})
          BODY=$(echo "$RELEASE" | jq -r '.body // "No release notes."')
          {
            echo "body<<__EOF__"
            echo "$BODY"
            echo ""
            echo "---"
            echo "### Build info"
            echo "- ✅ **BOLT** optimized (ext-tsp, hfsort, split-cold)"
            echo "- ✅ **ThinLTO** (LLVM LLD)"
            echo "- ✅ **Android Bionic** — NDK ${{ env.NDK_VERSION }}, API ${{ env.API_LEVEL }}"
            echo "- 🔖 Upstream: \`${{ env.UPSTREAM_TAG }}\`"
            echo "__EOF__"
          } >> $GITHUB_OUTPUT

      # ── Publish ──────────────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ env.UPSTREAM_TAG }}-android"
          name:     "Box64 ${{ env.UPSTREAM_TAG }} — Android Bionic"
          body:     "${{ steps.notes.outputs.body }}"
          files:    build/box64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
