name: Build Box64

on:
  schedule:
    - cron: "0 */6 * * *"   # كل 6 ساعات يشيك على تحديثات
  workflow_dispatch:         # تشغيل يدوي لو احتجت

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # الخطوة الأولى: شيك هل فيه تحديث في box64 الرسمي
  # ─────────────────────────────────────────────────────────────────────
  check-update:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.compare.outputs.should_build }}
      upstream_tag:  ${{ steps.compare.outputs.upstream_tag }}

    steps:
      - name: Fetch upstream latest tag
        id: upstream
        run: |
          TAG=$(curl -sf https://api.github.com/repos/ptitSeb/box64/releases/latest \
                | jq -r '.tag_name')
          echo "upstream_tag=$TAG" >> $GITHUB_OUTPUT

      - name: Fetch last tag we built
        id: local
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # نجيب آخر release بنيناه في الريبو ده
          LAST=$(gh release list --repo ${{ github.repository }} \
                   --limit 1 --json tagName -q '.[0].tagName' 2>/dev/null || echo "none")
          echo "last_tag=$LAST" >> $GITHUB_OUTPUT

      - name: Compare tags
        id: compare
        run: |
          UPSTREAM="${{ steps.upstream.outputs.upstream_tag }}"
          LAST="${{ steps.local.outputs.last_tag }}"
          EXPECTED="${UPSTREAM}-android"

          echo "Upstream : $UPSTREAM"
          echo "Last built: $LAST"

          if [[ "$LAST" == "$EXPECTED" ]]; then
            echo "✅ Already up-to-date — skipping build"
            echo "should_build=false" >> $GITHUB_OUTPUT
          else
            echo "🆕 New version detected — triggering build"
            echo "should_build=true"  >> $GITHUB_OUTPUT
          fi
          echo "upstream_tag=$UPSTREAM" >> $GITHUB_OUTPUT

  # ─────────────────────────────────────────────────────────────────────
  # الخطوة الثانية: البيلد نفسه (بس لو فيه تحديث)
  # ─────────────────────────────────────────────────────────────────────
  build:
    needs: check-update
    if: needs.check-update.outputs.should_build == 'true'
    runs-on: ubuntu-latest

    env:
      NDK_VERSION: r29
      API_LEVEL:   35
      TARGET:      aarch64-linux-android35
      UPSTREAM_TAG: ${{ needs.check-update.outputs.upstream_tag }}

    steps:
      - name: Checkout Box64 source (upstream tag)
        uses: actions/checkout@v4
        with:
          repository: ptitSeb/box64
          ref: ${{ env.UPSTREAM_TAG }}
          fetch-depth: 0

      # ── NDK ────────────────────────────────────────────────────────
      - name: Setup NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      # ── BOLT ───────────────────────────────────────────────────────
      - name: Install BOLT
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bolt

      # ── Toolchain vars ─────────────────────────────────────────────
      - name: Export toolchain vars
        run: |
          TC="${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64"
          echo "NDK_TC=$TC"                                    >> $GITHUB_ENV
          echo "CC=$TC/bin/${{ env.TARGET }}-clang"           >> $GITHUB_ENV
          echo "CXX=$TC/bin/${{ env.TARGET }}-clang++"        >> $GITHUB_ENV
          echo "AR=$TC/bin/llvm-ar"                           >> $GITHUB_ENV
          echo "NM=$TC/bin/llvm-nm"                           >> $GITHUB_ENV
          echo "RANLIB=$TC/bin/llvm-ranlib"                   >> $GITHUB_ENV
          echo "STRIP=$TC/bin/llvm-strip"                     >> $GITHUB_ENV
          echo "SYSROOT=$TC/sysroot"                          >> $GITHUB_ENV
          echo "$TC/bin"                                      >> $GITHUB_PATH

      # ── Configure: ThinLTO + emit-relocs ───────────────────────────
      - name: Configure (CMake)
        run: |
          cmake -B build \
            -DARM64=1 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER="$CC" \
            -DCMAKE_CXX_COMPILER="$CXX" \
            -DCMAKE_AR="$AR" \
            -DCMAKE_NM="$NM" \
            -DCMAKE_RANLIB="$RANLIB" \
            -DCMAKE_SYSROOT="$SYSROOT" \
            -DCMAKE_SYSTEM_NAME=Android \
            -DCMAKE_ANDROID_ARCH_ABI=arm64-v8a \
            -DCMAKE_C_FLAGS="-O3 -flto=thin" \
            -DCMAKE_CXX_FLAGS="-O3 -flto=thin" \
            -DCMAKE_EXE_LINKER_FLAGS="-fuse-ld=lld -flto=thin -Wl,--emit-relocs"

      - name: Compile
        run: cmake --build build -j$(nproc)

      # ── BOLT optimize ───────────────────────────────────────────────
      - name: BOLT optimize
        run: |
          llvm-bolt build/box64 \
            --reorder-blocks=ext-tsp \
            --reorder-functions=hfsort \
            --split-functions \
            --split-all-cold \
            --split-eh \
            --dyno-stats \
            -o build/box64.bolt

          mv build/box64.bolt build/box64

      # ── Strip ───────────────────────────────────────────────────────
      - name: Strip binary
        run: "$STRIP -s build/box64"

      # ── Fetch release notes من upstream ────────────────────────────
      - name: Fetch upstream release notes
        id: notes
        run: |
          RELEASE=$(curl -sf \
            https://api.github.com/repos/ptitSeb/box64/releases/tags/${{ env.UPSTREAM_TAG }})
          BODY=$(echo "$RELEASE" | jq -r '.body // "No release notes."')

          {
            echo "body<<__EOF__"
            echo "$BODY"
            echo ""
            echo "---"
            echo "### Build info"
            echo "- ✅ Built with **BOLT** (ext-tsp block reorder, hfsort, split-cold)"
            echo "- ✅ Built with **ThinLTO** (LLVM LLD)"
            echo "- ✅ Target: **Bionic (Android)** — NDK ${{ env.NDK_VERSION }}, API ${{ env.API_LEVEL }}"
            echo "- 🔖 Upstream tag: \`${{ env.UPSTREAM_TAG }}\`"
            echo "__EOF__"
          } >> $GITHUB_OUTPUT

      # ── Release ─────────────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ env.UPSTREAM_TAG }}-android"
          name:     "Box64 ${{ env.UPSTREAM_TAG }} — Android Bionic"
          body:     "${{ steps.notes.outputs.body }}"
          files:    build/box64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
